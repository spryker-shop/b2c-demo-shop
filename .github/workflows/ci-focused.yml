name: B2C-CI-FOCUSED

on:
    workflow_dispatch:
        inputs:
            framework:
                description: "Which framework to run (and only that)."
                required: true
                type: choice
                options:
                    - codeception
                    - cypress

concurrency:
    # Include the framework so concurrent focused runs on the same branch don't cancel each other
    # (a re-dispatch of the SAME framework still cancels its own in-flight run).
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.framework }}
    cancel-in-progress: true

# Every consumer restores the same build-once full_EU dump, so the build job runs for every
# framework choice — there is only one data flavour in this shop.
jobs:
    build-db:
        uses: ./.github/workflows/_build-db.yml
        secrets: inherit

    codeception:
        needs: [build-db]
        if: ${{ inputs.framework == 'codeception' }}
        uses: ./.github/workflows/_codeception.yml
        secrets: inherit

    cypress:
        needs: [build-db]
        if: ${{ inputs.framework == 'cypress' }}
        uses: ./.github/workflows/_cypress.yml
        secrets: inherit
