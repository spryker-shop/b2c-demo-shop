name: B2C-SCHEDULED

# The release-state checkers go red for reasons unrelated to any PR, so they run weekly, not per PR.

on:
    schedule:
        - cron: '0 4 * * 6'
    # Opt-in re-check from a PR, gated on the label that was just added so an unrelated label
    # never spawns a run. Re-add the label to re-run after new commits.
    pull_request:
        types: [labeled]
    workflow_dispatch:

env:
    SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    WEEKLY_CI_SLACK_CHANNEL_ID: ${{ secrets.WEEKLY_CI_SLACK_CHANNEL_ID }}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
    # Scheduled and manual runs on master are keyed by sha, so they never cancel one another.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    evaluator:
        if: >
            (github.event_name == 'pull_request' && github.event.label.name == 'run-evaluator')
            || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        name: "Evaluator"
        runs-on: ubuntu-latest

        env:
            APPLICATION_ENV: ci.mysql
            APPLICATION_STORE: DE
            PROJECT: suite
            SPRYKER_CURRENT_REGION: EU

        steps:
            -   uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
                with:
                    php-version: '8.4'
                    extensions: mbstring, intl, pdo_mysql, redis, grpc
                    tools: composer:v2
                    coverage: none

            -   name: Composer get cache directory
                id: composer-cache
                run: |
                    echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            -   name: Composer cache
                uses: actions/cache@v4
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-composer-

            -   name: Composer install
                run: composer install

            -   name: Run Evaluator
                run: vendor/bin/evaluator evaluate --exclude-checkers=SPRYKER_DEV_PACKAGES_CHECKER --format=compact

            -   name: Slack Notification for failed job
                uses: ./.github/actions/job-slack-notifications
                # continue-on-error keeps a Slack outage from reddening an otherwise green run.
                if: always()
                continue-on-error: true

    log-evaluator-bug:
        name: "Log Evaluator Bug"
        needs: [evaluator]
        # A failed Evaluator check of the weekly run becomes a Jira bug labelled scheduled-run-failure.
        # Same credentials and environment as the SN-SCHEDULED bug jobs in spryker/suite; switched by EVALUATOR_REPORT_ENABLED.
        if: >
            always()
            && vars.EVALUATOR_REPORT_ENABLED == 'true'
            && needs.evaluator.result == 'failure'
            && github.ref == 'refs/heads/master'
            && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        environment: flaky-reporting
        steps:
            -   uses: actions/checkout@v4

            -   name: Log the failed Evaluator check to Jira
                env:
                    FLAKY_JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
                    FLAKY_JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
                    JIRA_BASE_URL: https://spryker.atlassian.net
                    JIRA_API_BASE_URL: https://api.atlassian.com/ex/jira/180898d7-3b81-493b-89a0-4d56fd3f89b2
                    RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                run: |
                    python3 .github/workflows/scripts/scheduled-bug-report.py \
                        --pipeline B2C-SCHEDULED --check Evaluator --run-url "$RUN_URL"
